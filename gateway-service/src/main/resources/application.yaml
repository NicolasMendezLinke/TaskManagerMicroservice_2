spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: usuario-service
              uri: http://localhost:8080
              predicates:
                - Path=/usuarios/**

            - id: historico-service
              uri: http://localhost:8080
              predicates:
                - Path=/historico/**

            - id: tarefa-service
              uri: http://localhost:8081
              predicates:
                - Path=/tarefas/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods:
                  - "*"
                allowedHeaders:
                  - "*"

server:
  port: 8090